[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zh-catmut"
version = "0.1.0"
description = "Native LUT remapping for large Pandas categorical code buffers"
readme = "docs/README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
]
authors = [
    { name = "Mohamed Hossam" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/mohamedhossammohamed/zh_catmut"
Repository = "https://github.com/mohamedhossammohamed/zh_catmut"
Documentation = "https://mohamedhossammohamed.github.io/zh_catmut/"
Author = "https://github.com/mohamedhossammohamed"
X = "https://x.com/MohamedHz72007"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zh_catmut = [
    "py.typed",
    "libzh_catmut.so",
    "libzh_catmut.dylib",
    "zh_catmut.dll",
]
