[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zh-catmut"
version = "0.2.0"
description = "Native LUT remapping for large Pandas categorical code buffers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
]
authors = [
    { name = "Mohamed Hossam" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pandas", "categorical", "numpy", "zig", "ffi", "native-extension", "dataframe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Zig",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mohamedhossammohamed/zh_catmut"
Repository = "https://github.com/mohamedhossammohamed/zh_catmut"
Documentation = "https://mohamedhossammohamed.github.io/zh_catmut/"
Issues = "https://github.com/mohamedhossammohamed/zh_catmut/issues"
Author = "https://github.com/mohamedhossammohamed"
X = "https://x.com/MohamedHz72007"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "twine>=5.0",
    "mypy>=1.0",
    "ruff>=0.4.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
release = [
    "build>=1.0",
    "cibuildwheel>=2.16",
    "pytest>=8.0",
    "twine>=5.0",
]

[project.scripts]
zh-catmut = "zh_catmut._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zh_catmut = [
    "py.typed",
    "libzh_catmut.so",
    "libzh_catmut.dylib",
    "zh_catmut.dll",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest"]
test-command = "python -m zh_catmut doctor && python -m pytest -q {project}/tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
omit = ["src/zh_catmut/_cli.py", "src/zh_catmut/__main__.py"]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*"]
ignore_missing_imports = true

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-build = "python scripts/install_zig.py --install-dir /tmp/zig-bin"
environment = { ZIG = "/tmp/zig-bin/zig" }

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
